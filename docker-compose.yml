# Chạy job AI scan chứng chỉ MOOC.
#
#   docker compose up -d --build     # dựng và chạy nền
#   docker compose logs -f           # xem log trực tiếp
#   docker compose down              # dừng
#
# .env được GẮN LÚC CHẠY, không nằm trong image.

services:
  job:
    build: .
    image: mooc-elis:latest
    container_name: mooc-elis-job

    # ---- CHẠY TRÊN SERVER LINUX THÌ ĐỌC ĐOẠN NÀY ----
    # Container chạy bằng user `mooc`, và `useradd` trong image cấp cho nó
    # uid 1000. File gắn từ ngoài vào (mooc_log.db, .report_state.json,
    # .alert_state.json) GIỮ NGUYÊN chủ sở hữu của host. Nên nếu tài khoản
    # Linux của bạn KHÔNG phải uid 1000 — chuyện thường gặp trên server có
    # nhiều tài khoản — container không ghi được vào chúng, và lỗi hiện ra là
    # "attempt to write a readonly database", chẳng gợi gì tới quyền file.
    #
    # Kiểm:   id -u
    # Nếu ra 1000 thì bỏ qua. Nếu KHÁC 1000, bỏ dấu # ở dòng dưới rồi chạy:
    #   UID_HOST=$(id -u) GID_HOST=$(id -g) docker compose up -d
    #
    # user: "${UID_HOST:-1000}:${GID_HOST:-1000}"
    #
    # Trên Docker Desktop (Windows/macOS) KHÔNG cần và KHÔNG nên bật dòng
    # này — bind mount ở đó đã tự lo phần quyền.

    # Nạp biến trong .env vào container. File nằm ngoài image nên đổi key
    # chỉ cần sửa .env rồi `docker compose restart`, không build lại.
    env_file:
      - .env

    volumes:
      # pydantic-settings đọc trực tiếp FILE .env (không chỉ biến môi trường),
      # nên phải gắn cả file vào. Chỉ đọc.
      - ./.env:/app/.env:ro

      # File log SQLite. database/database.py đặt DB_PATH ở GỐC dự án
      # (mooc_log.db), không phải trong thư mục database/ — nên phải gắn
      # đúng file này. Thiếu nó thì mỗi lần dựng lại container là mất sạch
      # lịch sử xử lý.
      - ./mooc_log.db:/app/mooc_log.db

      # Kho chung chi that (chi dung khi LUU_CHUNG_CHI=1 trong .env).
      # Phai gan ra ngoai, neu khong thi `docker compose up --build` lan sau
      # la mat sach kho — ma kho la thu KHONG lay lai duoc: ban ghi da roi
      # trang thai WAITING nen eLIS khong tra ve nua.
      # Day la THU MUC (khong phai file) nen Docker tu tao neu chua co.
      - ./cert_archive:/app/cert_archive

      # Moc bao cao da gui. Phai gan ra ngoai: mat file nay khi container
      # dung lai = quen da gui = gui trung bao cao cho mentor.
      - ./.report_state.json:/app/.report_state.json

      # Moc canh bao loi he thong da gui. Cung ly do, nhung hau qua nang hon:
      # su co ha tang thuong lam container crash-loop, va `restart:
      # unless-stopped` dung lai lien tuc. Mat moc moi lan dung lai nghia la
      # moi lan dung lai gui them mot thu canh bao — dung luc he thong dang
      # hong nhat thi hop thu nguoi van hanh ngap thu trung.
      #
      # File nay phai TON TAI truoc khi `docker compose up`, giong
      # mooc_log.db: Docker gap bind-mount FILE chua co se tao mot THU MUC
      # trung ten, va alert.py se khong ghi duoc moc.
      #   PowerShell: '{}' | Out-File -Encoding utf8 .alert_state.json
      - ./.alert_state.json:/app/.alert_state.json

    # Tự bật lại khi container chết hoặc khi máy khởi động lại.
    # "unless-stopped": tôn trọng khi bạn chủ động `docker compose down`.
    restart: unless-stopped

    # Giới hạn dung lượng log, tránh đầy ổ khi chạy dài ngày.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
